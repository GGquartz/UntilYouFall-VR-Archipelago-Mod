name: APWorld

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: apworld-${{ github.ref }}
  cancel-in-progress: true

env:
  AP_VERSION: "0.6.8"
  SKIP_REQUIREMENTS_UPDATE: "1"

jobs:
  apworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dev/dev-requirements.txt

      - name: Archipelago source with only this world
        run: |
          git clone --depth 1 --branch "$AP_VERSION" https://github.com/ArchipelagoMW/Archipelago.git "$RUNNER_TEMP/Archipelago"
          find "$RUNNER_TEMP/Archipelago/worlds" -mindepth 1 -maxdepth 1 -type d ! -name generic -exec rm -rf {} +
          cp -r src/apworld/until_you_fall "$RUNNER_TEMP/Archipelago/worlds/until_you_fall"
          pip install -r dev/dev-requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/Archipelago" >> "$GITHUB_ENV"

      - name: Generated data is current
        run: |
          python dev/export-game-data.py --check
          python dev/export-options.py --check

      - name: APWorld tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: APWorld packages
        run: python dev/build-apworld.py --ap-source "$RUNNER_TEMP/Archipelago"
